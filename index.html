<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klaviyo Multi-Product Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    .products-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }
    .product-btn {
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .product-btn:hover {
      background-color: #218838;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
      padding: 10px;
      border-radius: 4px;
    }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <h2>Interactive Product View Tracker</h2>
  
  <div class="form-group">
    <label for="email">1. Enter User Email:</label>
    <input type="email" id="email" placeholder="customer@example.com" required>
  </div>

  <label>2. Click a Product to Track View:</label>
  <div class="products-grid">
    <button class="product-btn" data-product="Running Shoes">👟 Running Shoes</button>
    <button class="product-btn" data-product="Leather Jacket">🧥 Leather Jacket</button>
    <button class="product-btn" data-product="Wireless Headphones">🎧 Headphones</button>
    <button class="product-btn" data-product="Smart Watch">⌚ Smart Watch</button>
  </div>

  <div id="status"></div>

  <script>
    const COMPANY_ID = 'ThNhQm'; // Replace with your Klaviyo Public API Key

    async function trackProductView(productName) {
      const email = document.getElementById('email').value.trim();
      const statusEl = document.getElementById('status');

      if (!email) {
        statusEl.className = 'error';
        statusEl.innerText = 'Please enter an email address first!';
        return;
      }

      statusEl.className = '';
      statusEl.innerText = `Tracking view for "${productName}"...`;

      const payload = {
        data: {
          type: 'event',
          attributes: {
            profile: {
              email: email
            },
            metric: {
              name: 'Viewed Product'
            },
            properties: {
              ProductName: productName
            }
          }
        }
      };

      try {
        const response = await fetch(`https://a.klaviyo.com/client/events/?company_id=${COMPANY_ID}`, {
          method: 'POST',
          headers: {
            'accept': 'application/json',
            'revision': '2023-02-22',
            'content-type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          statusEl.className = 'success';
          statusEl.innerText = `Successfully recorded "Viewed Product" for ${productName}!`;
        } else {
          statusEl.className = 'error';
          statusEl.innerText = `Error ${response.status}: ${response.statusText}`;
        }
      } catch (err) {
        console.error(err);
        statusEl.className = 'error';
        statusEl.innerText = 'Failed to send request. Check console for details.';
      }
    }

    // Attach click listeners to all product buttons
    document.querySelectorAll('.product-btn').forEach(button => {
      button.addEventListener('click', (e) => {
        const productName = e.target.getAttribute('data-product');
        trackProductView(productName);
      });
    });
  </script>
</body>
</html>
